services:
  postgres:
    image: postgres:16-alpine
    container_name: elayone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: elayone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - elayone_pgdata:/var/lib/postgresql/data

volumes:
  elayone_pgdata:
